<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UFC Lightweight Division | Contact</title>
</head>
<body>
  <header>
    <h1>Contact Me</h1>
  </header>
  <nav>
    <a href="../index.html">Home</a> |
    <a href="fighters.html">Fighters</a> |
    <a href="history.html">Title History</a> |
    <a href="contact.html">Contact</a>
  </nav>
  <main>
    <h2>Tell me who should fight next</h2>
    <form method="post">
      <p>
        <label for="name">Your name</label><br>
        <input type="text" id="name" name="name" required>
      </p>
      <p>
        <label for="email">Your email</label><br>
        <input type="email" id="email" name="email" required>
      </p>
      <p>
        <label for="fighter">Favourite lightweight</label><br>
        <select id="fighter" name="fighter">
          <option value="gaethje">Justin Gaethje</option>
          <option value="topuria">Ilia Topuria</option>
          <option value="oliveira">Charles Oliveira</option>
          <option value="other">Someone else</option>
        </select>
      </p>
      <p>
        <label for="message">Your message</label><br>
        <textarea id="message" name="message" rows="5" cols="40"></textarea>
      </p>
      <p><button type="submit">Send</button></p>
    </form>
    <h2>Or email me directly</h2>
    <p><a href="mailto:amanuelyaya69@gmail.com">amanuelyaya69@gmail.com</a></p>
  </main>
  <footer>
    <p>Made for CoSc 3081. <a href="amanuelyaya69@gmail.com">Email me</a></p>
  </footer>
</body>
</html>
